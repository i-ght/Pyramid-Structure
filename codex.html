<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Electric Pyramid Animation</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="pyramidCanvas"></canvas>
  <script>
    const canvas = document.getElementById("pyramidCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resize);
    resize();

    let time = 0;

    function drawGrid() {
      const spacing = 40;
      ctx.strokeStyle = "#003366";
      ctx.lineWidth = 1;

      for (let x = 0; x <= canvas.width; x += spacing) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = 0; y <= canvas.height; y += spacing) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawPyramid() {
      const centerX = canvas.width / 2;
      const baseY = canvas.height * 0.85;
      const maxRadius = canvas.width * 0.35;
      const numCircles = 30;

      for (let i = 0; i < numCircles; i++) {
        const progress = i / numCircles;
        const y = baseY - progress * canvas.height * 0.8;
        const baseRadius = maxRadius * progress;
        const pulse = Math.sin(time + i * 0.2) * 4;

        // Ensure radii stay positive
        const outerRadius = Math.max(baseRadius + pulse, 1);
        const innerRadius = Math.max(baseRadius * 0.2, 0.1);

        const gradient = ctx.createRadialGradient(centerX, y, innerRadius, centerX, y, outerRadius);
        gradient.addColorStop(0, "rgba(255,255,255,0.6)");
        gradient.addColorStop(0.5, "rgba(255,153,51,0.4)");
        gradient.addColorStop(1, "rgba(255,0,255,0.1)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(centerX, y, outerRadius, 10 + pulse, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }


    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawGrid();
      drawPyramid();

      time += 0.03;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>

</html>
